name: Build Windows app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build SpotMatch
        run: pyinstaller --onefile --windowed --name SpotMatch --collect-data sv_ttk app.py

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path dist/SpotMatch.exe -DestinationPath SpotMatch-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SpotMatch-Windows
          path: SpotMatch-Windows.zip
          if-no-files-found: error
